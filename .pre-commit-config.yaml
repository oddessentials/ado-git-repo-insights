# Python hooks are executed via Husky; do not run `pre-commit install` manually.
# This file is the single source of truth for Python checks.
# Husky invokes pre-commit automatically on commit and push.
#
# NOTE: mypy is run in CI only (requires optional [ml] deps for full coverage).

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        # Auto-fix on commit for a smoother DX; re-run hook will verify clean.
        args: [--fix]
        stages: [pre-commit]
      - id: ruff
        name: ruff (check)
        stages: [pre-push]
      - id: ruff-format
        # Auto-format on commit for a smoother DX.
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format (check)
        args: [--check]
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit, pre-push]
      - id: check-merge-conflict
        stages: [pre-commit, pre-push]
      - id: detect-private-key
        stages: [pre-commit, pre-push]

  - repo: local
    hooks:
      - id: env-guard
        name: Environment Variable Guard
        entry: python scripts/env_guard.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: pytest
        name: pytest
        entry: python -m pytest tests/ --no-cov -q
        language: system
        pass_filenames: false
        stages: [manual]  # Run via Husky pre-push, not pre-commit

      - id: suppression-format
        name: Suppression Format Validation (FR-017)
        entry: python scripts/audit-suppressions.py --check-justifications
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: tool-version-parity
        name: Tool Version Parity
        entry: python scripts/check_tool_versions.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
