# Hook invocation chain:
#   git commit/push → .husky/pre-commit|pre-push → run_repo_hook.py
#     → pre-commit run (this file's hooks) + custom Python gates
#
# Do NOT run `pre-commit install` — Husky manages the git hook entry points.
# This file defines the ruff, formatting, and suppression hooks that
# run_repo_hook.py invokes via `pre-commit run --hook-stage <stage>`.
#
# NOTE: mypy is Tier 2 (pre-push only) — requires [ml] optional deps.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        # Auto-fix on commit for a smoother DX; re-run hook will verify clean.
        args: [--fix]
        stages: [pre-commit]
      - id: ruff
        name: ruff (check)
        stages: [pre-push]
      - id: ruff-format
        # Auto-format on commit for a smoother DX.
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format (check)
        args: [--check]
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit, pre-push]
      - id: check-merge-conflict
        stages: [pre-commit, pre-push]
      - id: detect-private-key
        stages: [pre-commit, pre-push]

  - repo: local
    hooks:
      - id: suppression-format
        name: Suppression Format Validation (FR-017)
        entry: python scripts/audit-suppressions.py --check-justifications
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: suppression-count
        name: Suppression Count Guard
        entry: python scripts/audit-suppressions.py --diff
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: env-guard
        name: Environment Variable Guard
        entry: python scripts/env_guard.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: pytest
        name: pytest
        entry: python -m pytest tests/ --no-cov -q
        language: system
        pass_filenames: false
        stages: [manual]  # Run via Husky pre-push, not pre-commit

      - id: tool-version-parity
        name: Tool Version Parity
        entry: python scripts/check_tool_versions.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: yaml-validate
        name: YAML Validation
        entry: python scripts/validate_yaml_files.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: cli-reference-drift
        name: CLI reference drift (docs/reference/cli-reference.md ↔ create_parser())
        entry: python scripts/generate_cli_reference.py --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Mirrors the ruff-format pattern: auto-format at pre-commit so drift
      # is caught BEFORE a commit lands, rather than surfacing minutes later
      # at the pre-push `Extension format check` gate inside PR preflight.
      # Invokes the authoritative `format` script (outside form, since this
      # hook runs from repo root) per the single-command-per-gate invariant
      # in tests/unit/test_ci_parity_drift.py TestFormatWriteParity.
      - id: prettier-format
        name: prettier (auto-format extension sources)
        entry: pnpm --dir ./extension run format
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
