# gitleaks configuration for ado-git-repo-insights
# See: https://github.com/gitleaks/gitleaks

title = "ADO Git Repo Insights Gitleaks Config"

[extend]
# Use default gitleaks rules as base
useDefault = true

# Allowlist for test fixtures and examples
[allowlist]
description = "Allow known test fixtures and documentation"
paths = [
  '''tests/.*\.py''',
  '''tests/fixtures/.*''',
  '''.*\.example\..*''',
  '''config\.example\.yaml''',
  '''.*sample-pipeline\.yml''',
  '''extension-verification-test\.yml''',
  '''insights-verification-test\.yml''',
  '''docs/.*''',
  '''\.md$''',
  '''package-lock\.json''',
  '''\.gitleaks\.toml''',
  # Feature 309 #315: anonymized statistical distribution fixtures. These
  # files contain weighted token frequencies, lognormal params, and weekly
  # means derived from a tenant SQLite via
  # scripts/extract_distribution_fixtures.py; they hold no secrets. The
  # commit-time privacy gate tests/unit/test_distribution_fixture_privacy.py
  # enforces the real invariants (no email/URL/tenant-identifier tokens,
  # locked truncation-week literals, privacy_review_date bounds).
  '''scripts/demo-distributions/.*''',
]
