# gitleaks configuration for ado-git-repo-insights
# See: https://github.com/gitleaks/gitleaks

title = "ADO Git Repo Insights Gitleaks Config"

[extend]
# Use default gitleaks rules as base
useDefault = true

# Allowlist for test fixtures and examples
[allowlist]
description = "Allow known test fixtures and documentation"
paths = [
  '''tests/.*\.py''',
  '''tests/fixtures/.*''',
  '''.*\.example\..*''',
  '''config\.example\.yaml''',
  '''.*sample-pipeline\.yml''',
  '''extension-verification-test\.yml''',
  '''insights-verification-test\.yml''',
  '''docs/.*''',
  '''\.md$''',
  '''package-lock\.json''',
  '''\.gitleaks\.toml''',
]
