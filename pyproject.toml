[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ado-git-repo-insights"
dynamic = ["version"]
description = "Extract Azure DevOps Pull Request metrics to SQLite and generate PowerBI-compatible CSVs."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Odd Essentials, LLC", email = "admin@oddessentials.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "pandas>=3.0.0",
    "azure-storage-blob>=12.0.0",  # Optional fallback storage
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff==0.15.11",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "types-requests>=2.28.0",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.0.0,<4.0.0",
    "jsonschema>=4.0",
    "defusedxml==0.7.1",  # Safe XML parsing for CI scripts
    "build>=1.0",  # Python package build validation in preflight
]
ml = [
    "prophet>=1.1.0",
    "openai>=1.0.0",
]

[project.scripts]
ado-insights = "ado_git_repo_insights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ado_git_repo_insights = ["ui_bundle/**/*"]

[tool.setuptools_scm]
# Configures setuptools_scm to use git tags for versioning

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "PT"]
ignore = [
    "E501",   # Allow long lines in some cases
    "S101",   # Allow assert in tests
    "S603",   # subprocess with shell=False — compensated by check_rule_disable_invariants.py
              # Proof: .rule-disable-audit-S603.json exact-match artifact plus committed
              # .subprocess-allowlist.json for reviewed non-literal repo-owned commands
    "S607",   # Partial executable path — all uses are repo-owned tools (git, python)
              # Compensated by S603 guardrail (detects unsafe subprocess patterns)
    "S311",   # random module usage — all uses are deterministic seeded synthetic data
              # Proof: .rule-disable-audit-S311.json. Compensated by --check-random guardrail
    "N999",   # Invalid module name — 14 CLI scripts use hyphenated names by convention
              # (scripts/*.py, .github/scripts/*.py). These are invoked via `python script.py`,
              # not imported as modules. All importable modules in src/ use valid identifiers.
]

[tool.ruff.lint.isort]
known-first-party = ["ado_git_repo_insights"]

[tool.pytest.ini_options]
minversion = "7.0"
# Keep only the persistent pytest cache in the repo root. Normal local runs
# use pytest defaults for basetemp because forcing basetemp into repo-owned
# per-run directories triggers Windows teardown failures at session finish.
addopts = "-ra -q --cov=src/ado_git_repo_insights --cov-report=term-missing"
cache_dir = ".tmp/pytest/cache"
# Keep tmp_path directories for debugging; this does not change pytest's own
# basetemp selection for ordinary local runs.
tmp_path_retention_policy = "all"
testpaths = ["tests"]
pythonpath = ["src"]
# Suppress ResourceWarning for unclosed database connections
# These warnings come from pandas and test fixtures where the connection is
# managed by the test framework and properly cleaned up at test teardown
filterwarnings = [
    "ignore::ResourceWarning",
    "ignore:unclosed database:ResourceWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
mypy_path = ["scripts"]
# Disable redundant-cast warnings: pandas-stubs versions differ between CI
# (Ubuntu) and local (Windows), causing cast(pd.DataFrame, ...) to be required
# in CI but flagged as redundant locally. See forecaster.py:176, fallback_forecaster.py:403.
warn_redundant_casts = false
exclude = [
    "^build/",
    "^dist/",
    "^\\.venv/",
]

[[tool.mypy.overrides]]
module = [
    "azure.storage.blob",
    "prophet",
    "openai",
    "defusedxml.*",
]
ignore_missing_imports = true

# Tests and scripts: pragmatic overrides — strict typing on src/, relaxed on
# test/script code where fixtures, mocks, and one-off helpers dominate.
# Bare generics (dict vs dict[str, int]) and Any-returns from mocks are normal
# in test code; strict annotations live in src/.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = true
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false

# Scripts override: mypy_path = ["scripts"] makes these top-level modules.
# Without scripts/__init__.py, "scripts.*" no longer matches; list modules
# explicitly.  The test_mypy_scripts_override_coverage test enforces that
# every valid-identifier script module appears here.
[[tool.mypy.overrides]]
module = [
    "_ci_yaml_parser",
    "_platform_test_filters",
    "_pytest_count_collector",
    "build_demo",
    "check_coverage_delta",
    "check_no_any_types",
    "check_partial_branches",
    "check_patch_coverage",
    "check_pr_record_schema_parity",
    "check_python_collection_parity",
    "check_ratchet_bump",
    "check_rule_disable_invariants",
    "check_test_floor_contract",
    "check_threshold_changes",
    "check_tool_versions",
    "csv_diff",
    "demo_generation_common",
    "demo_shell",
    "env_guard",
    "extract_distribution_fixtures",
    "generate_cli_reference",
    "invariant_contracts",
    "manage_generated_artifacts",
    "pytest_cov_launcher_plugin",
    "run_ci_parity",
    "run_pr_preflight",
    "run_pytest",
    "run_repo_hook",
    "strip_pr_arrays",
    "sync_ui_bundle",
    "test_floor_contract",
    "validate_demo_generation_contract",
    "validate_yaml_files",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = true
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false

[tool.coverage.run]
source = ["src/ado_git_repo_insights"]
branch = true
# Static fallback for bare pytest (without the launcher). The documented
# entrypoint (scripts/run_pytest.py) sets COVERAGE_FILE per-run before
# pytest starts; preflight also overrides via COVERAGE_FILE env var.
data_file = ".tmp/pytest/coverage/.coverage"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 75  # floor(77.59 - 2.0) = 75 per docs/development/ratchets.md formula
show_missing = true
