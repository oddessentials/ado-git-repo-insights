# Codecov configuration
# See: https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "50...90"

  status:
    project:
      default:
        target: auto
        threshold: 2%  # Allow 2% variance from target
    patch:
      default:
        target: auto
        threshold: 5%  # Be lenient on new code

# Ignore patterns for files tested by integration tests instead of unit tests
# Entry point files are validated by Playwright smoke tests (test:smoke)
ignore:
  - "extension/ui/dashboard.ts"      # Entry point, tested by smoke tests
  - "extension/ui/artifact-client.ts" # Entry point, tested by smoke tests
  - "extension/ui/dataset-loader.ts"  # Entry point, tested by smoke tests
  - "extension/ui/settings.ts"        # Entry point, tested by smoke tests
  - "scripts/**"                      # Scripts tested by subprocess, not importable

# Flag configuration for language-specific coverage
# Enables separate badges: ?flag=python and ?flag=typescript
flags:
  python:
    paths:
      - src/
    carryforward: true
    after_n_builds: 1

  typescript:
    paths:
      - extension/ui/
    carryforward: true
    after_n_builds: 1

# Comment configuration for PRs
comment:
  layout: "header, diff, flags, components"
  behavior: default
  require_changes: true
